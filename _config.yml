title: Nexy
description: Select and compare detailed character profiles in battle matchups.
url: "https://syntax555.github.io"
baseurl: "/Nexy"
lang: en
encoding: utf-8
safe: true
strict_front_matter: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - assets/images/characters/README.md
  - schema
  - scripts
  - test
  - tmp
  - vendor
