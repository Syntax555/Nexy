<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090b12">
    <title>Page not found | Nexy Battle Lab</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #090b12;
        color: #f7f9fc;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(75, 220, 255, 0.12), transparent 32rem),
          radial-gradient(circle at 80% 60%, rgba(255, 78, 145, 0.1), transparent 34rem);
      }
      main {
        display: grid;
        width: min(680px, calc(100% - 40px));
        gap: 18px;
      }
      span {
        color: #4bdcff;
        font-size: 0.75rem;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 10ch;
        margin: 0;
        font-family: "Arial Black", Impact, sans-serif;
        font-size: clamp(3rem, 12vw, 7rem);
        line-height: 0.86;
        letter-spacing: -0.06em;
        text-transform: uppercase;
      }
      p {
        max-width: 50ch;
        margin: 0;
        color: #aeb7c7;
        line-height: 1.7;
      }
      a {
        width: fit-content;
        margin-top: 6px;
        padding: 14px 20px;
        border-radius: 999px;
        background: #f7f9fc;
        color: #090b12;
        font-weight: 900;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #fff3b0;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <span>Error 404</span>
      <h1>This matchup left the arena.</h1>
      <p>The page may have moved, but the complete fighter roster is still ready.</p>
      <a href="/Nexy/">Return to Battle Lab</a>
    </main>
  </body>
</html>
