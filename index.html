<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090b12">
    <meta name="color-scheme" content="dark light">
    <meta
      name="description"
      content="Build character matchups and inspect every stat, power, resistance, and battle interaction."
    >
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Nexy">
    <meta property="og:title" content="Nexy Battle Lab">
    <meta
      property="og:description"
      content="Pick two fighters. Read every advantage. Resolve the matchup with a transparent ruleset."
    >
    <meta property="og:url" content="https://syntax555.github.io/Nexy/">
    <meta property="og:image" content="https://syntax555.github.io/Nexy/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Nexy Battle Lab">
    <meta
      name="twitter:description"
      content="Pick two fighters. Read every advantage."
    >
    <meta name="twitter:image" content="https://syntax555.github.io/Nexy/og.png">
    <meta name="twitter:image:alt" content="Nexy Battle Lab character matchup arena">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Nexy Battle Lab character matchup arena">
    <link rel="canonical" href="https://syntax555.github.io/Nexy/">
    <title>Nexy Battle Lab</title>
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("nexy-theme");
        } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-shell" role="status" aria-live="polite">
        <span class="boot-mark">N</span>
        <span>Loading Battle Lab…</span>
      </div>
    </div>
    <noscript>Nexy Battle Lab requires JavaScript to resolve character matchups.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
