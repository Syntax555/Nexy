<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="__NEXY_THEME_COLOR__">
    <meta name="color-scheme" content="dark light">
    <meta
      name="description"
      content="__NEXY_DESCRIPTION__"
    >
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="__NEXY_SHORT_NAME__">
    <meta property="og:title" content="__NEXY_SITE_NAME__">
    <meta
      property="og:description"
      content="__NEXY_SOCIAL_DESCRIPTION__"
    >
    <meta property="og:url" content="__NEXY_SITE_URL__">
    <meta property="og:image" content="__NEXY_SOCIAL_IMAGE_URL__">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="__NEXY_SITE_NAME__">
    <meta
      name="twitter:description"
      content="__NEXY_SOCIAL_DESCRIPTION__"
    >
    <meta name="twitter:image" content="__NEXY_SOCIAL_IMAGE_URL__">
    <meta name="twitter:image:alt" content="Nexy Battle Lab character matchup arena">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Nexy Battle Lab character matchup arena">
    <link rel="canonical" href="__NEXY_SITE_URL__">
    <link rel="icon" type="image/png" sizes="32x32" href="__NEXY_FAVICON_URL__">
    <link rel="apple-touch-icon" sizes="180x180" href="__NEXY_APPLE_TOUCH_ICON_URL__">
    <link rel="manifest" href="__NEXY_MANIFEST_URL__">
    <script type="application/ld+json">__NEXY_STRUCTURED_DATA__</script>
    <title>__NEXY_SITE_NAME__</title>
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("nexy-theme");
        } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "dark" ? "#090b12" : "#f5f3ee"
        );
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-shell" role="status" aria-live="polite">
        <span class="boot-mark">N</span>
        <span>Loading Battle Lab…</span>
      </div>
    </div>
    <noscript>Nexy Battle Lab requires JavaScript to resolve character matchups.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
